name: courier

on:
  pull_request:
    paths:
      - 'services/courier/**'
      - '.github/workflows/courier.yml'
  push:
    branches:
      - main
      - eurosky/fork
    paths:
      - 'services/courier/**'
      - '.github/workflows/courier.yml'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Type check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/courier
    services:
      postgres:
        # 17.11-alpine3.24, the major version the AppView host runs
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: courier
          POSTGRES_PASSWORD: courier
          POSTGRES_DB: courier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courier"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: ⬇️ Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The service runs on the AppView host's Node 22.
      - name: 🔧 Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: services/courier/package-lock.json

      - name: ⚙️ Install dependencies
        run: npm ci --no-fund --no-audit

      - name: 🧬 Check generated code is current
        run: |
          npm run gen
          git diff --exit-code -- src/gen

      - name: 🔍 Type check
        run: npm run typecheck

      - name: 🧪 Test
        env:
          COURIER_TEST_DATABASE_URL: postgres://courier:courier@127.0.0.1:5432/courier_test
        run: npm test
