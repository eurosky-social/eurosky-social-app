# Eurosky fork: build the web app for one GitHub environment and deploy it to
# that environment's Bunny.net zone. New file (not in upstream) -> no merge
# surface.
#
#   push eurosky/fork    -> staging     (https://staging.mu.social)
#   push eurosky/deploy  -> production  (https://mu.social)
#   manual run           -> any environment, from any branch the environment
#                           allows (Actions -> "Deploy web" -> Run workflow)
#
# Build settings live in git, one file per environment:
# .github/environments/<environment>.env on top of common.env (see the README
# there). The GitHub environment holds only what must not be in git - the
# Bunny credentials - plus the branch rules and reviewers that gate it.
#
# Secrets per GitHub environment (production, staging, dev, oso):
#   BUNNY_STORAGE_ZONE      full base URL incl. zone, e.g.
#                           https://storage.bunnycdn.com/eurosky-app
#   BUNNY_STORAGE_PASSWORD  storage zone password (AccessKey for uploads)
#   BUNNY_PULLZONE_ID       numeric pull zone id (cache purge + edge setup)
# Repository secret (an environment secret of the same name overrides it):
#   BUNNY_API_KEY           account-level API key (cache purge + edge setup)
name: Deploy web

on:
  push:
    branches: [eurosky/fork, eurosky/deploy]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy the selected branch to
        type: environment
        required: true

# Least privilege: only checks out + uploads to Bunny via Bunny secrets; never
# uses GITHUB_TOKEN to write to the repo.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || (github.ref_name == 'eurosky/deploy' && 'production') || 'staging' }}
      url: ${{ steps.build.outputs.url }}
    # One deploy per environment at a time; a newer run supersedes an
    # in-flight one. Environments never queue on each other.
    concurrency:
      group: deploy-web-${{ inputs.environment || (github.ref_name == 'eurosky/deploy' && 'production') || 'staging' }}
      cancel-in-progress: true
    env:
      DEPLOY_ENV: ${{ inputs.environment || (github.ref_name == 'eurosky/deploy' && 'production') || 'staging' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      # Environment secrets fall back to repository secrets of the same name,
      # so a half-configured environment could silently reach another zone.
      # Fail before building rather than upload to the wrong place.
      - name: Check Bunny configuration
        env:
          ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          PULLZONE: ${{ secrets.BUNNY_PULLZONE_ID }}
          API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PROD_PULLZONE: '5945167'
        run: |
          test -n "$ZONE" && test -n "$PASSWORD" && test -n "$PULLZONE" && test -n "$API_KEY" || {
            echo "Set BUNNY_STORAGE_ZONE, BUNNY_STORAGE_PASSWORD and BUNNY_PULLZONE_ID on the '$DEPLOY_ENV' environment, and BUNNY_API_KEY" >&2
            exit 1
          }
          if [[ "$DEPLOY_ENV" == production && "$PULLZONE" != "$PROD_PULLZONE" ]]; then
            echo "Refusing: production must use pull zone $PROD_PULLZONE" >&2
            exit 1
          fi
          if [[ "$DEPLOY_ENV" != production && "$PULLZONE" == "$PROD_PULLZONE" ]]; then
            echo "Refusing: '$DEPLOY_ENV' is configured with the production pull zone" >&2
            exit 1
          fi
      # web_build.sh loads the environment's .env files and runs the brand's
      # build: frozen install (CI=true) -> intl:build -> build-web -> static
      # path rewrite -> robots.txt.
      - name: Build web
        id: build
        run: bash ./scripts/web_build.sh "$DEPLOY_ENV"
      - name: Upload to Bunny + purge cache
        run: bash ./scripts/bunny_upload.sh "$BUILD_DIR"
        env:
          BUILD_DIR: ${{ steps.build.outputs.dir }}
          # Purge until the site serves this build: replicated storage can
          # lag the upload, and an early purge re-caches the old files.
          BUNNY_PUBLIC_URL: ${{ steps.build.outputs.url }}
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
      # Bot-mitigation config (network limits + cache/block edge rules) applied
      # as infrastructure-as-code. Idempotent - matches existing rules by
      # description and updates in place, so it is safe to run every deploy.
      # Additive: a zone's own noindex X-Robots-Tag rule is left untouched.
      - name: Apply Bunny edge config (limits + rules)
        if: steps.build.outputs.edge_setup == 'true'
        run: bash ./scripts/bunny_edge_setup.sh
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
