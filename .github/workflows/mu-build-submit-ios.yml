---
name: Mu – Build and Submit iOS

# Builds on EAS and uploads the result to App Store Connect. The upstream
# build-submit-ios.yml is left untouched and stays gated to Bluesky's repo.

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: Build profile (production for App Store releases)
        options:
          - production
          - testflight
      submit:
        type: boolean
        description: Upload the build to App Store Connect
        default: true
      sourceRef:
        type: string
        description: Source ref to build; defaults to the selected branch
        required: false
        default: ''

# EAS does the work via EXPO_TOKEN; the GITHUB_TOKEN only checks out code
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'eurosky-social/eurosky-social-app'
    name: Build iOS
    # The build itself runs on EAS; this runner only uploads the project and waits.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: mu-ios-build
      cancel-in-progress: false
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sourceRef || github.sha }}
          fetch-depth: 5
          persist-credentials: false

      - name: 🔧 Setup Expo project
        uses: $/.github/actions/setup-expo-project
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          eas-version: '25.3.0'

      # Compiled catalogs are git-ignored but not EAS-ignored, so they are
      # uploaded with the project. EAS does not compile them itself.
      - name: 🔤 Compile translations
        uses: $/.github/actions/compile-i18n

      # EAS assigns the build number (autoIncrement) and signs with the
      # credentials it already stores. .env is EAS-ignored, so build-time
      # variables come from eas.json.
      - name: 🏗️ EAS Build
        id: build
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          pnpm eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            --freeze-credentials \
            --wait \
            --json > build.json

          status="$(jq -r '.[0].status' build.json)"
          build_id="$(jq -r '.[0].id' build.json)"
          if [ "$status" != "FINISHED" ]; then
            echo "ERROR: EAS build $build_id ended with status $status"
            exit 1
          fi

          echo "build-id=$build_id" >> "$GITHUB_OUTPUT"
          {
            echo "### iOS build"
            echo
            echo "\`$(jq -r '.[0].appVersion' build.json) ($(jq -r '.[0].appBuildVersion' build.json))\`, profile \`$PROFILE\`"
            echo
            echo "https://expo.dev/accounts/eurosky/projects/mu-social/builds/$build_id"
          } >> "$GITHUB_STEP_SUMMARY"

      # eas.json reads the App Store Connect API key from the ASC_API_KEY_*
      # variables. The key file exists only while this step runs.
      - name: 🚀 Submit to App Store Connect
        if: ${{ inputs.submit }}
        env:
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          ASC_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          export ASC_API_KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          trap 'rm -f "$ASC_API_KEY_PATH"' EXIT
          (umask 077 && echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_API_KEY_PATH")
          pnpm eas submit -p ios --profile production --id "$BUILD_ID" --non-interactive --wait
