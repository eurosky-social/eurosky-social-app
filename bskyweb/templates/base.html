<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  <link rel="preconnect" href="https://bsky.social">
  <link rel="preconnect" href="https://go.bsky.app">
  <title>{%- block head_title -%}mu{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  {% include "fonts.html" %}

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
     */
    html,
    body {
      margin: 0px;
      padding: 0px;
      font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }
    /*
     * mu: keep in sync with src/config/brand-theme.ts and web/index.html.
     *   light bg #FFFFFF | dark bg #000000 | dim bg #1A1A1A
     */
    /* BRAND-GEN:colors start - generated from src/config/brand-colors.json by scripts/sync-brand-web.mjs (run `pnpm brand:sync-web`; do not hand-edit) */
    :root {
      --text: #212121;
      --background: #FFFFFF;
      --backgroundLight: #F7F7F2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --text: #F7F7F2;
        --background: #000000;
        --backgroundLight: #212121;
      }
    }
    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100%;
      width: 100%;
    }
    html.theme--light,
    html.theme--light body,
    html.theme--light #root {
      background-color: #FFFFFF;
      --text: #212121;
      --background: #FFFFFF;
      --backgroundLight: #F7F7F2;
    }
    html.theme--dark,
    html.theme--dark body,
    html.theme--dark #root {
      color-scheme: dark;
      background-color: #000000;
      --text: #F7F7F2;
      --background: #000000;
      --backgroundLight: #212121;
    }
    html.theme--dim,
    html.theme--dim body,
    html.theme--dim #root {
      color-scheme: dark;
      background-color: #1A1A1A;
      --text: #F7F7F2;
      --background: #1A1A1A;
      --backgroundLight: #242424;
    }
    /* BRAND-GEN:colors end */
    #splash {
      display: flex;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      align-items: center;
      justify-content: center;
    }
    #splash svg {
      position: relative;
      top: -50px;
      width: 100px;
    }
    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>
  <script>
    const theme = localStorage.getItem('ALF_THEME') || 'dark'
    if (theme) {
      document.documentElement.classList.add(`theme--${theme}`)
    }
  </script>

  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ staticCDNHost }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#00837A">
  <!-- BRAND-GEN:theme-color start - brand-colors.json defaultAccent primary_500 (run `pnpm brand:sync-web`) -->
  <meta name="theme-color" content="#00837A">
  <!-- BRAND-GEN:theme-color end -->
  <meta name="application-name" content="mu">
  <meta name="generator" content="bskyweb">
  {% if noindex %}<meta name="robots" content="noindex{% if nofollow %}, nofollow{% endif %}">{% endif %}
  <meta property="og:site_name" content="mu">
  <meta property="og:logo" content="{{ favicon }}">
  <!-- BRAND-GEN:twitter-site start - brand-meta.json socialHandle, omitted when empty (run `pnpm brand:sync-web`) -->

  <!-- BRAND-GEN:twitter-site end -->
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>
<body>

  </div>
  <div id="root">
  </div>

  <noscript>

    {% block noscript_extra %}{% endblock %}
    <div data-nosnippet>
      <p lang="en">Enable JavaScript to use {{ brandName }}.</p>
      <p lang="en">Learn more about mu at <a href="https://mu.social">mu.social</a> and <a href="https://atproto.com">atproto.com</a>.</p>

  </noscript>
{% endblock -%}
</body>
</html>
