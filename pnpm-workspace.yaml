nodeLinker: 'hoisted'
autoInstallPeers: true # default: true
strictPeerDependencies: false # default: false
packageExtensions:
  eslint-plugin-react-native-a11y:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-simple-import-sort:
    peerDependenciesMeta:
      eslint:
        optional: true
trustPolicy: 'no-downgrade' # default: off
trustPolicyIgnoreAfter: 10080 # 7 days, default: undefined
overrides:
  # Eurosky fork: zod is split across two majors on purpose.
  # - Default 3.24.4 (last pre-3.25): zod 3.25 restructured its internals ("Zod 4
  #   in v3 clothing"), which breaks @atproto/did@0.3.0's `zod.z` access once
  #   bundled by webpack (works in Node, throws "Cannot read properties of
  #   undefined (reading 'string')" in the browser). All @atproto packages declare
  #   zod ^3.23.8, so 3.24.4 satisfies the whole bundled stack consistently.
  # - eslint-plugin-react-hooks (+ its nested zod-validation-error) import the
  #   `zod/v4` subpath, which only exists in zod >=3.25. With the 3.24.4 default
  #   they crash ESLint (ERR_PACKAGE_PATH_NOT_EXPORTED ./v4) and block pre-commit.
  #   These are lint-only (not in the web bundle), so pin them to 3.25.x.
  'zod': '3.24.4'
  'eslint-plugin-react-hooks>zod': '3.25.76'
  'zod-validation-error>zod': '3.25.76'
  # Eurosky fork: OAuth client stack pins (migrated from package.json "resolutions")
  '@atproto/jwk': '0.6.0'
  '@atproto/jwk-jose': '0.1.11'
  '@atproto/jwk-webcrypto': '0.2.0'
  '@atproto/oauth-client': '0.5.14'
  '@atproto/oauth-client-browser': '0.3.40'
  '@react-native/babel-preset': '0.86.0'
  '@react-native/normalize-colors': '0.86.0'
  '@expo/image-utils': '0.8.12'
  '@types/estree': '1.0.6'
  'react-native-compressor': '1.13.0'
  'react-native-reanimated': '4.5.3'
  'react-native-worklets': '0.11.3'
  'psl': '1.9.0'
  '@types/psl': '1.1.1'
  'react-native-screens': '4.26.2'
allowBuilds:
  '@sentry/cli': true
  'core-js-pure': true
  'esbuild': true
  # Eurosky fork: explicitly DENY these two build scripts (false) so pnpm does
  # not re-prompt / rewrite this file.
  # - unrs-resolver: its postinstall verifier is not required at runtime and has
  #   previously failed under pnpm due to a non-executable linked binary.
  # - core-js: its postinstall only prints a donation message; nothing to build.
  'unrs-resolver': false
  'core-js': false
patchedDependencies:
  '@sentry/expo-upload-sourcemaps@8.18.0': patches/@sentry__expo-upload-sourcemaps@8.18.0.patch
  'expo-age-range@57.0.2': patches/expo-age-range@57.0.2.patch
  'expo-haptics@57.0.1': patches/expo-haptics@57.0.1.patch
  'expo-media-library@57.0.3': patches/expo-media-library@57.0.3.patch
  'expo-modules-core@57.0.8': patches/expo-modules-core@57.0.8.patch
  'expo-notifications@57.0.7': patches/expo-notifications@57.0.7.patch
  'expo-updates@57.0.10': patches/expo-updates@57.0.10.patch
  expo@57.0.8: patches/expo@57.0.8.patch
  'react-native-compressor@1.13.0': patches/react-native-compressor@1.13.0.patch
  'react-native-date-picker@5.0.13': patches/react-native-date-picker@5.0.13.patch
  'react-native-dotenv@3.4.11': patches/react-native-dotenv@3.4.11.patch
  'react-native-drawer-layout@4.2.3': patches/react-native-drawer-layout@4.2.3.patch
  'react-native-keyboard-controller@1.21.9': patches/react-native-keyboard-controller@1.21.9.patch
  'react-native-pager-view@6.8.0': patches/react-native-pager-view@6.8.0.patch
  'react-native-reanimated@4.5.3': patches/react-native-reanimated@4.5.3.patch
  'react-native-screens@4.26.2': patches/react-native-screens@4.26.2.patch
  'react-native-svg@15.15.4': patches/react-native-svg@15.15.4.patch
  react-native-worklets@0.11.3: patches/react-native-worklets@0.11.3.patch
  'react-native@0.86.0': patches/react-native@0.86.0.patch
minimumReleaseAgeExclude:
  - '@atproto/*'
  - '@atproto-labs/*'
  - '@bsky.app/*'
  - '@bsky/*'
